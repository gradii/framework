# Port of the GitHub test workflows:
#   Test          .github/workflows/test.yml, test_pr.yml (goravel/.github test.yml)
#   Test External .github/workflows/test_external.yml
#   Test Database (added here only: no upstream counterpart)
#
# CNB has no matrix, so every Go version is its own pipeline, and the pipelines
# of an event run in parallel. The windows job of Test is not ported, the hosted
# CNB runners are Linux only.

# The counterpart of the actions/setup-go cache. Pushes to master update it,
# pull requests only read it, so untrusted PR code can't poison it.
.go-cache: &go-cache
  - master:/go/pkg/mod:copy-on-write
  - master:/root/.cache/go-build:copy-on-write

.go-cache-read-only: &go-cache-read-only
  - master:/go/pkg/mod:copy-on-write-read-only
  - master:/root/.cache/go-build:copy-on-write-read-only

.go: &go
  runner:
    # Same as ubuntu-latest, the integration tests only run SQL Server on x86.
    tags: cnb:arch:amd64
  env:
    # proxy.golang.org may be unreachable from the CNB runners in China, so the
    # module cache is fetched from mirrors. Each mirror is kept ahead of
    # `direct` (a direct VCS fetch is usually unreachable from the runners too)
    # and the list has more than one entry of the same kind on purpose: a single
    # mirror returns 500 spuriously now and then
    # (`mirrors.cloud.tencent.com ... 500 Internal Server Error`), which would
    # fail `go mod tidy` before it ever reaches `direct`. `go` falls through to
    # the next entry on a 5xx, so the mirrors back each other up.
    GOPROXY: https://mirrors.cloud.tencent.com/go/,https://goproxy.cn,https://goproxy.io,direct

.test: &test
  <<: *go
  stages:
    - name: install dependencies
      # `go mod tidy` rewrites go.mod/go.sum, so a retry is safe (it is
      # idempotent) and it rescues the build from a one-off network hiccup.
      script: go mod tidy || (sleep 5 && go mod tidy)
    - name: run tests
      script: go test -timeout 10m ./...

.test-database: &test-database
  <<: *go
  stages:
    - name: install dependencies
      script: go mod tidy || (sleep 5 && go mod tidy)
    - name: run database tests
      # Every package under database/ is stub-backed: no database, no Docker, no
      # services block. That is why this can be its own pipeline rather than a
      # step of Test External, and why it is safe on the Linux-only CNB runners.
      script: go test -timeout 10m ./database/...

.test-external: &test-external
  <<: *go
  services:
    # The database containers of the goravel/* drivers run on a Docker daemon of
    # the platform. `docker context inspect` of the job reports
    # unix:///var/run/docker.sock, so the job shares the socket of the daemon and
    # the ports its containers publish are reachable on the loopback of the job,
    # like on the GitHub runners.
    - docker
  stages:
    - name: install dependencies
      # Idempotent and retried, same reason as the `Test` pipeline above.
      script: (go mod tidy && cd tests && go mod tidy) || (sleep 5 && go mod tidy && cd tests && go mod tidy)
    - name: run tests
      # Container startup and fixture creation across four databases count
      # toward the test package's timeout. Allow 25m for the tests within the
      # 30m stage budget, leaving time for compilation and cleanup. Verbose
      # output reports progress while the integration package is running.
      timeout: 30m
      script:
        - cd tests && go test -v -timeout 25m ./...

master:
  push:
    - name: Test (go 1.26)
      <<: *test
      docker:
        image: golang:1.26
        volumes: *go-cache
    - name: Test (go 1.27)
      <<: *test
      docker:
        image: golang:1.27
        volumes: *go-cache
    - name: Test Database (go 1.26)
      <<: *test-database
      docker:
        image: golang:1.26
        volumes: *go-cache
    - name: Test External (go 1.26)
      <<: *test-external
      docker:
        image: golang:1.26
        volumes: *go-cache
    - name: Test External (go 1.27)
      <<: *test-external
      docker:
        image: golang:1.27
        volumes: *go-cache

# Pull requests into any branch, like the unfiltered pull_request of GitHub.
"**":
  pull_request:
    - name: Test (go 1.26)
      <<: *test
      docker:
        image: golang:1.26
        volumes: *go-cache-read-only
    - name: Test (go 1.27)
      <<: *test
      docker:
        image: golang:1.27
        volumes: *go-cache-read-only
    - name: Test Database (go 1.26)
      <<: *test-database
      docker:
        image: golang:1.26
        volumes: *go-cache-read-only
    - name: Test External (go 1.26)
      <<: *test-external
      docker:
        image: golang:1.26
        volumes: *go-cache-read-only
    - name: Test External (go 1.27)
      <<: *test-external
      docker:
        image: golang:1.27
        volumes: *go-cache-read-only
