# A named pipeline for the database packages, ported from .cnb/test.yml: the
# reusable Test workflow already covers them, but a database failure shows up
# here as its own check instead of inside a 244-package log. The packages are
# stub-backed, so no database and no Docker are needed.

name: Test Database
on:
  push:
    branches:
      - main
  pull_request:
env:
  # The sibling repositories are cloned from GitHub here; CNB uses its own host.
  GRADII_FRAMEWORK_URL: https://github.com/gradii/framework
  GRADII_MYSQL_URL: https://github.com/gradii/mysql
  GRADII_POSTGRES_URL: https://github.com/gradii/postgres
  GRADII_SQLITE_URL: https://github.com/gradii/sqlite
  GRADII_SQLSERVER_URL: https://github.com/gradii/sqlserver
  GRADII_MYSQL_REF: main
  GRADII_POSTGRES_REF: main
  GRADII_SQLITE_REF: main
  GRADII_SQLSERVER_REF: main
jobs:
  ubuntu:
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Run database tests
        run: bash .cnb/ci.sh database
