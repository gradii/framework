name: Test In Example
# The upstream workflow tested goravel/example against this checkout. There is no
# Gradii example application yet, and the upstream one requires
# github.com/goravel/framework, so the replace below never applied. Manual until
# a Gradii example exists; the two jobs are kept as the recipe for it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    strategy:
      matrix:
        go: [ "1.26", "1.27" ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout framework
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: framework

      - name: Checkout goravel/example
        uses: actions/checkout@v7
        with:
          repository: goravel/example
          ref: master
          path: example

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Go mod cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('example/**/go.sum', 'framework/**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-

      - name: Replace framework with local checkout
        working-directory: example
        run: |
          go mod edit -replace github.com/gradii/framework=../framework
          go mod tidy

      - name: Run tests
        working-directory: example
        run: go test -timeout 10m -run "^TestMainTestSuite$" . ./app/...

  integration:
    strategy:
      matrix:
        go: [ "1.26", "1.27" ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout framework
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: framework

      - name: Checkout goravel/example
        uses: actions/checkout@v7
        with:
          repository: goravel/example
          ref: master
          path: example

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Go mod cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('example/**/go.sum', 'framework/**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-

      - name: Replace framework with local checkout
        working-directory: example
        run: |
          go mod edit -replace github.com/gradii/framework=../framework
          go mod tidy

      - name: Run tests
        working-directory: example
        run: go test -timeout 10m ./tests/...
