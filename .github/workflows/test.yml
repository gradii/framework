# The same jobs live in .cnb/test.yml. The unit job calls .cnb/ci.sh, which builds
# a temporary Go workspace from the sibling repositories so every module is tested
# against the current framework rather than against the released tags. The
# driver-free job below proves the framework module itself needs none of them:
# it runs with GOWORK=off and fails if go.mod would have to require a driver.
#
# The unit job then runs `ci.sh specified`, which is how the *.go.test files are run:
# they need a driver module the framework must not require, so they are renamed into
# place for that step alone and renamed back when it ends.
#
# The badge is generated by this workflow, which is why the pull_request event
# lives in test_pr.yml instead of being added to the `on` field below. The
# Windows job of the original workflow is not ported: the driver build needs cgo
# and the SQLite driver is the least portable of the four.

name: Test
on:
  push:
    branches:
      - main
env:
  # The sibling repositories are cloned from GitHub here; CNB uses its own host.
  GRADII_FRAMEWORK_URL: https://github.com/gradii/framework
  GRADII_MYSQL_URL: https://github.com/gradii/mysql
  GRADII_POSTGRES_URL: https://github.com/gradii/postgres
  GRADII_SQLITE_URL: https://github.com/gradii/sqlite
  GRADII_SQLSERVER_URL: https://github.com/gradii/sqlserver
  GRADII_MYSQL_REF: main
  GRADII_POSTGRES_REF: main
  GRADII_SQLITE_REF: main
  GRADII_SQLSERVER_REF: main
jobs:
  ubuntu:
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Test all root modules
        run: bash .cnb/ci.sh unit
      - name: Run the specified tests
        run: bash .cnb/ci.sh specified
  driver-free:
    strategy:
      matrix:
        go: ["1.26", "1.27"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: No specified test file may be renamed in here
        run: |
          for f in $(git ls-files '*.go.test'); do
            if [ -e "${f%.test}" ]; then
              echo "::error::${f%.test} is renamed in; go mod tidy would then require a driver module"
              exit 1
            fi
          done
      - name: Build and test the module alone
        run: GOWORK=off go test -count=1 ./...
      - name: go.mod must not require a driver module
        run: GOWORK=off go mod tidy -diff
