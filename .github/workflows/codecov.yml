# Coverage of the root module, measured inside the workspace the test workflows
# build. The upload is allowed to fail: this repository has no CODECOV secret, so
# it only starts reporting once the project is registered there.
name: Codecov
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
env:
  # The sibling repositories are cloned from GitHub here; CNB uses its own host.
  GRADII_FRAMEWORK_URL: https://github.com/gradii/framework
  GRADII_MYSQL_URL: https://github.com/gradii/mysql
  GRADII_POSTGRES_URL: https://github.com/gradii/postgres
  GRADII_SQLITE_URL: https://github.com/gradii/sqlite
  GRADII_SQLSERVER_URL: https://github.com/gradii/sqlserver
  GRADII_MYSQL_REF: main
  GRADII_POSTGRES_REF: main
  GRADII_SQLITE_REF: main
  GRADII_SQLSERVER_REF: main
jobs:
  codecov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
      - name: Build the workspace
        run: echo "GOWORK=$(bash .cnb/ci.sh workspace | sed -n 's/^GOWORK=//p')" >> "$GITHUB_ENV"
      - name: Run tests with coverage
        run: go test -timeout 10m -coverprofile="coverage.out" $(go list ./... | grep -v /mocks | grep -v /facades | grep -v /contracts | grep -v /testing/mock)
      - name: Print coverage report
        run: go tool cover -func=coverage.out
      - name: Upload coverage report to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV }}
